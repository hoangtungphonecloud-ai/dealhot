<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TungHoang — Săn deal hot mỗi ngày</title>
<meta name="description" content="Tổng hợp deal hot, mã giảm giá và link tiếp thị mỗi ngày: Shopee, Lazada, Tiki, Highlands và nhiều thương hiệu khác.">
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 0; background: #fff; color: #222; }
  .topbar { border-bottom: 1px solid #eee; padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; max-width: 1140px; margin: 0 auto; }
  .logo-img-link { display: inline-flex; align-items: center; text-decoration: none; }
  .logo-wrap { position: relative; display: inline-block; width: 48px; height: 48px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.22); animation: logoFloat 3.5s ease-in-out infinite; }
  .logo-wrap img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .logo-wrap::after { content: ""; position: absolute; top: 0; left: -80%; width: 55%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-20deg); animation: logoShine 4.5s ease-in-out infinite; }
  @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes logoShine { 0%,55% { left: -80%; } 100% { left: 135%; } }
  nav { display: flex; flex-wrap: wrap; gap: 4px 18px; }
  nav a { text-decoration: none; color: #333; font-size: 13px; font-weight: 700; letter-spacing: 0.6px; padding: 6px 2px; text-transform: uppercase; }
  nav a:hover, nav a.active { color: #c0392b; }
  .searchbar { max-width: 1140px; margin: 18px auto 0; padding: 0 20px; }
  .searchbar input { width: 100%; max-width: 420px; display: block; margin: 0 auto; padding: 10px 16px; font-size: 15px; border: 1px solid #ddd; border-radius: 999px; outline: none; }
  .searchbar input:focus { border-color: #1a56db; }
  .section-title { text-align: center; color: #8B0000; font-size: 24px; letter-spacing: 1px; margin: 26px 0 20px; padding: 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px 16px; max-width: 1140px; margin: 0 auto; padding: 0 20px 40px; }
  .tile { text-decoration: none; color: inherit; display: block; }
  .tile.coming { cursor: default; }
  .thumb { aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 19px; line-height: 1.25; color: #fff; padding: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.12); transition: transform .15s ease; }
  a.tile:hover .thumb { transform: translateY(-3px); }
  .thumb img { width: 100%; height: 100%; object-fit: contain; padding: 14px; }
  .label { background: #c0392b; color: #fff; text-align: center; padding: 9px 6px; border-radius: 7px; margin-top: 9px; font-size: 14px; font-weight: 700; }
  .coupon { width: 100%; margin-top: 8px; border: 2px dashed #e67e22; background: #fef9e7; color: #935116; border-radius: 7px; padding: 7px 6px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .coupon:hover { background: #fdeec9; }
  .empty { text-align: center; color: #888; padding: 40px 0; grid-column: 1 / -1; }
  footer { border-top: 1px solid #eee; text-align: center; color: #999; font-size: 13px; padding: 22px 16px 34px; }
  footer a { color: #1a56db; text-decoration: none; }
</style>
<style>
/* ===== Professional theme upgrade ===== */
html { scroll-behavior: smooth; }
::selection { background: rgba(249,115,22,.28); }
body {
  background:
    radial-gradient(900px 420px at 10% -4%, rgba(249,115,22,.12), transparent 60%),
    radial-gradient(820px 400px at 90% 4%, rgba(124,58,237,.10), transparent 60%),
    radial-gradient(760px 520px at 50% 112%, rgba(26,86,219,.08), transparent 60%),
    linear-gradient(180deg, #FFFBF4 0%, #FFFFFF 36%);
  background-attachment: fixed;
  min-height: 100vh;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: radial-gradient(rgba(26,86,219,.08) 1px, transparent 1.5px);
  background-size: 26px 26px;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 42%);
  mask-image: linear-gradient(180deg, #000 0%, transparent 42%);
}
.page-frame {
  position: fixed; inset: 10px; z-index: 1200; pointer-events: none; border-radius: 18px;
  border: 3px solid transparent;
  background: linear-gradient(135deg, #f97316, #7c3aed 55%, #1a56db) border-box;
  -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
}
.topbar {
  position: sticky; top: 0; z-index: 900;
  background: rgba(255,255,255,.88);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(20,20,40,.07);
  box-shadow: 0 8px 28px rgba(124,58,237,.08);
}
nav a { position: relative; transition: color .2s ease; padding-bottom: 8px; }
nav a::after {
  content: ""; position: absolute; left: 2px; right: 2px; bottom: 3px; height: 2px; border-radius: 2px;
  background: linear-gradient(90deg, #f97316, #7c3aed);
  transform: scaleX(0); transform-origin: left; transition: transform .25s ease;
}
nav a:hover::after, nav a.active::after { transform: scaleX(1); }
.section-title {
  background: linear-gradient(115deg, #c0392b 10%, #7c3aed 90%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  font-size: 27px; position: relative; z-index: 1;
}
.section-title::after {
  content: ""; display: block; width: 76px; height: 4px; margin: 12px auto 0; border-radius: 4px;
  background: linear-gradient(90deg, #f97316, #7c3aed, #1a56db);
}
.searchbar { position: relative; z-index: 1; }
.searchbar input {
  box-shadow: 0 3px 14px rgba(30,30,60,.07);
  transition: border-color .2s ease, box-shadow .2s ease;
  background: rgba(255,255,255,.94);
}
.searchbar input:focus { border-color: #f97316; box-shadow: 0 0 0 4px rgba(249,115,22,.16); }
.grid { position: relative; z-index: 1; }
.tile { animation: tileIn .55s cubic-bezier(.22,.8,.32,1) backwards; }
@keyframes tileIn { from { opacity: 0; transform: translateY(24px) scale(.98); } }
a.tile { transition: transform .22s ease; }
a.tile:hover { transform: translateY(-6px); }
a.tile:hover .thumb { box-shadow: 0 16px 34px rgba(124,58,237,.20); }
.thumb { transition: box-shadow .25s ease; }
.thumb img { transition: transform .35s ease; }
a.tile:hover .thumb img { transform: scale(1.08); }
.label {
  background: linear-gradient(135deg, #d43d2a, #a93226);
  box-shadow: 0 3px 10px rgba(192,57,43,.25);
  transition: filter .2s ease, box-shadow .2s ease;
}
a.tile:hover .label { filter: brightness(1.1); box-shadow: 0 6px 16px rgba(192,57,43,.35); }
.coupon { transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
.coupon:hover { transform: translateY(-1px); background: #fdf0d3; box-shadow: 0 5px 14px rgba(230,126,34,.35); }
footer { position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="page-frame" aria-hidden="true"></div>

<header class="topbar">
  <a class="logo-img-link" href="#/"><span class="logo-wrap"><img src="https://graph.facebook.com/870613039464573/picture?type=large&amp;width=200" alt="TungHoang"></span></a>
  <nav id="nav"></nav>
</header>

<div class="searchbar"><input id="q" type="search" placeholder="Tìm deal, thương hiệu..." autocomplete="off"></div>

<h2 class="section-title" id="sectionTitle">DEAL HOT HÔM NAY</h2>
<div class="grid" id="grid"></div>

<footer>
  <span id="footTag">Săn deal hot mỗi ngày</span> ·
  <a href="gioi-thieu.html">Giới thiệu</a>
</footer>

<script>
let DATA = null;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function catLabel(slug) {
  if (DATA.categories && DATA.categories[slug]) return DATA.categories[slug];
  return slug.replace(/-/g, " ").toUpperCase();
}

async function load() {
  try {
    const r = await fetch("deals.json", { cache: "no-store" });
    DATA = await r.json();
  } catch (e) {
    document.getElementById("grid").innerHTML = '<div class="empty">Không tải được dữ liệu deal. Thử tải lại trang.</div>';
    return;
  }
  document.title = esc(DATA.site.title) + " — " + esc(DATA.site.tagline);
  document.getElementById("footTag").textContent = DATA.site.tagline;
  renderNav();
  route();
}

function renderNav() {
  const cats = [...new Set(DATA.deals.filter(d => d.active).map(d => d.category))].sort();
  let html = '<a href="#/" data-nav="">HOME</a><a href="gioi-thieu.html">GIỚI THIỆU</a>';
  cats.forEach(function (c) { html += '<a href="#/' + esc(c) + '" data-nav="' + esc(c) + '">' + esc(catLabel(c)) + '</a>'; });
  document.getElementById("nav").innerHTML = html;
}

function tileHTML(d, i) {
  const delay = Math.min((i || 0) * 55, 660);
  const bg = d.image
    ? '<img src="' + esc(d.image) + '" alt="' + esc(d.name) + '" loading="lazy">'
    : esc(d.name);
  const thumbBg = d.image ? "#ffffff" : esc(d.color || "#555");
  const thumb = '<div class="thumb" style="background:' + thumbBg + '">' + bg + '</div>';
  const label = '<div class="label">' + esc(d.label || d.name) + '</div>';
  const coupon = d.coupon
    ? '<button class="coupon" data-code="' + esc(d.coupon) + '" title="Bấm để copy mã">Mã: ' + esc(d.coupon) + ' ⧉</button>'
    : '';
  const inner = thumb + label + coupon;
  const style = ' style="animation-delay:' + delay + 'ms"';
  if (d.url) {
    return '<a class="tile"' + style + ' href="' + esc(d.url) + '" target="_blank" rel="noopener sponsored">' + inner + '</a>';
  }
  return '<div class="tile coming"' + style + '>' + inner + '<div class="label" style="background:#999">Sắp cập nhật link</div></div>';
}

function route() {
  if (!DATA) return;
  const hash = (location.hash || "#/").replace(/^#\//, "");
  const q = document.getElementById("q").value.trim().toLowerCase();
  document.querySelectorAll("#nav a[data-nav]").forEach(function (a) {
    a.classList.toggle("active", a.getAttribute("data-nav") === hash);
  });
  let list = DATA.deals.filter(d => d.active).sort((a, b) => (a.order || 0) - (b.order || 0));
  if (hash) list = list.filter(d => d.category === hash);
  if (q) list = list.filter(d => (d.name + " " + (d.label || "") + " " + (d.note || "")).toLowerCase().includes(q));
  document.getElementById("sectionTitle").textContent = hash ? catLabel(hash) : "DEAL HOT HÔM NAY";
  document.getElementById("grid").innerHTML = list.length
    ? list.map(tileHTML).join("")
    : '<div class="empty">Chưa có deal nào trong mục này.</div>';
}

document.addEventListener("click", function (e) {
  const b = e.target.closest(".coupon");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const code = b.getAttribute("data-code");
  function done() { const t = b.textContent; b.textContent = "Đã copy!"; setTimeout(() => b.textContent = t, 1200); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(done);
  } else {
    const ta = document.createElement("textarea"); ta.value = code;
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (err) {}
    document.body.removeChild(ta); done();
  }
});

document.getElementById("q").addEventListener("input", route);
window.addEventListener("hashchange", route);
load();
</script>
</body>
</html>
